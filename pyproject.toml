[project]
name = "qcp-adaptive-termination"
version = "0.1.0"
description = "Collaborative Query Processing with Adaptive Termination"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "async-lru>=2.3.0",
    "chevron>=0.14.0",
    "datasketch>=2.0.0",
    "datasketches>=5.2.0",
    "evoc>=0.3.1",
    "faiss-cpu>=1.15.0",
    "fast-hdbscan>=0.3.2",
    "langfuse>=4.14.3",
    "llama-index>=0.14.23",
    "matplotlib>=3.11.1",
    "nest-asyncio2>=1.7.2",
    "numpy>=2.5.2",
    "openai>=2.53.0",
    "orjson>=3.9.0",
    "openai-agents>=0.19.4",
    "openinference-instrumentation-openai-agents>=2.0.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rbloom>=1.5.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlalchemy>=2.0.51",
    "sqlglot>=30.17.0",
    "tiktoken>=0.13.0",
    "tqdm>=4.70.0",
    "umap-learn>=0.5.12",
    "xxhash>=3.5.0",
    "numba>=0.68.0",
]

[project.scripts]
qcp-adaptive-termination = "qcp_adaptive_termination.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcp_adaptive_termination"]

[tool.uv]
exclude-newer = "P2D"
exclude-newer-package = { ty = "2026-10-14T00:00:00Z" }

[tool.uv.pip]
exclude-newer = "P2D"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.ty.environment]
extra-paths = ["src/typings"]

[tool.pyright]
stubPath = "src/typings"
include = ["src"]
pythonVersion = "3.15"
typeCheckingMode = "standard"
reportPrivateUsage = true
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "faker>=40.36.0",
    "imdb-sqlite>=2.1.0",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "ipywidgets>=8.1.8",
    "pylint>=4.0.7",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "ty>=0.0.87",
]
