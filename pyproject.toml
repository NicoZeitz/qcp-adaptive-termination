[project]
name = "qcp-adaptive-termination"
version = "0.1.0"
description = "Collaborative Query Processing with Adaptive Termination"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "async-lru>=2.3.0",
    "chevron>=0.14.0",
    "datasketch>=2.0.0",
    "datasketches>=5.2.0",
    "faiss-cpu>=1.14.3",
    "langfuse>=4.5.1",
    "llama-index>=0.14.20",
    "matplotlib>=3.10.9",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.4",
    "openai>=2.31.0",
    "openai-agents>=0.13.6",
    "openinference-instrumentation-openai-agents>=1.4.2",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rbloom>=1.5.4",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.49",
    "umap-learn>=0.5.12",
]

[project.scripts]
qcp-adaptive-termination = "qcp_adaptive_termination.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qcp_adaptive_termination"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "SIM",
    "I",
]

[tool.ty.environment]
extra-paths = ["src/typings"]

[tool.pyright]
stubPath = "src/typings"
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportPrivateUsage = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "faker>=40.23.0",
    "imdb-sqlite>=2.1.0",
    "ipykernel>=7.3.0",
    "ipython>=9.15.0",
    "ipywidgets>=8.1.8",
    "pylint>=4.0.5",
    "pyright>=1.1.411",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
    "ty>=0.0.69",
]
