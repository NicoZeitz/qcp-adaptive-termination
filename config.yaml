estimator:
  count_estimator: chao92
  value_estimator: naive
  use_bucket: true
  use_monte_carlo: false
  max_buckets: 100
  confidence_interval_type: chao84
  confidence_epsilon: 0.05

target_confidence: 0.95
apportionment: weighted
warmup_agents: 2

# Completeness LLM long-list behavior
# stop_llm_max_list_items: 1000
# long_list_behavior: estimator_reasoning  # prevent | estimator_reasoning
# completeness_show_estimator_stats: false
# completeness_summarize_history: true

# Replanning
# replan_include_prior_attempts: true

continue_after_final_result: true
selection_type: theta_sketch
selection_kwargs:
  # registry_type: natural_language  # technical | natural_language                  # embedding
  lg_k: 12                              # <number>                                      # hll_sketch, theta_sketch, posterior
  use_ucb: false                         # true | false                                  # hll_sketch, theta_sketch
  # clustered_prior: false                 # true | false                                  # posterior
  # min_samples: 1                         # <number>                                      # posterior
  # min_cluster_size_ratio: 0.05           # <number>                                      # posterior
  # num_perm: 128                   # <number>                                      # min_hash
align_schema_agent_limit: 1000

embedding_model: "openai/text-embedding-3-large"

costs:
  "openai/text-embedding-3-large":
    embedding: 0.13
  "university/unsloth/DeepSeek-V4-Flash-0731":
    input: 0.14
    cached_input: 0.014
    cache_write: 0.14
    output: 0.28


agent_configs:
  discovery-coordinator-relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  planning-coordinator-draft-query-plan:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  execution-coordinator-answer-step:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  execution-coordinator-replan:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  execution-coordinator-align-schema:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  execution-coordinator-world-knowledge-stop:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  execution-coordinator-result-producer:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  discovery-data-agent-schema-description:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  discovery-data-agent-relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  execution-data-agent-query:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
