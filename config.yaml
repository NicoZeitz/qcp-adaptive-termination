estimator_mode: full
count_estimator: chao92
value_estimator: naive
use_bucket: true
use_monte_carlo: false
include_confidence_intervals: true

continue_after_final_result: true
selection_type: theta_sketch
selection_kwargs:
  registry_type: natural_language  # technical | natural_language                  # embedding
  # lg_k: 12                              # <number>                                      # hll_sketch, theta_sketch, posterior
  # use_ucb: false                         # true | false                                  # hll_sketch, theta_sketch
  # clustered_prior: true                  # true | false                                  # posterior
  # min_samples: 1                         # <number>                                      # posterior
  # min_cluster_size_ratio: 0.05           # <number>                                      # posterior
  # num_perm: 128                   # <number>                                      # min_hash
align_schema_agent_limit: 1000

embedding_model: "openai/text-embedding-3-large"
llm_timeout: 120.0
log_llm_requests: false

agent_configs:
  coordinator_relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  coordinator_planning:
    model: "openai/gpt-5"
    reasoning_effort: "high"
    reasoning_summary: "concise"
  coordinator_code:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  coordinator_replanning:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  coordinator_align_schema:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  coordinator_completeness_evaluator:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  data_agent_schema_description:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  data_agent_relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  data_agent_code:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "high"
  query_decomposer:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  embedding_text_generator:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  embedding_column_relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  embedding_iterative_relevance:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
  embedding_boundary_finder:
    model: "university/unsloth/DeepSeek-V4-Flash-0731"
    reasoning_effort: "none"
