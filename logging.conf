[loggers]
keys=root

[handlers]
keys=fileHandler

[formatters]
keys=richFormatter

[logger_root]
level=INFO
handlers=fileHandler

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=richFormatter
args=('%(logfile)s', 'a', 'utf-8')

[formatter_richFormatter]
class=logging.Formatter
format=[{asctime}][{levelname}][{name}][{processName}({process})/{threadName}({thread})][{pathname}:{lineno} {funcName}] {message}
datefmt=%Y-%m-%d %H:%M:%S
style={
